name: Feature Request
description: Suggest an idea for the Oracle Cloud integration
title: '[Feature]: '
labels: ['enhancement', 'triage']
assignees:
  - FaserF
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!

        Before submitting, please check:
        - 📋 [Existing feature requests](https://github.com/FaserF/ha-oraclecloud/issues?q=is%3Aissue+label%3Aenhancement)
        - 📖 [Documentation](https://github.com/FaserF/ha-oraclecloud/blob/master/README.md)

  - type: textarea
    id: description
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which OCI area does this feature relate to?
      options:
        - Compute instance management (start/stop/reboot)
        - Resource monitoring / sensors
        - Cost / billing tracking
        - Storage management
        - Networking resources
        - Multiple resource types
        - Authentication / configuration
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false