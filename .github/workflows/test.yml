name: Test

on:
  workflow_call:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14.6"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-cov homeassistant oci pytest-homeassistant-custom-component
      - name: Test with pytest
        run: |
          python -m pytest --cov=custom_components.oraclecloud --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
